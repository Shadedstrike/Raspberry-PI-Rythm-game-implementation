[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi2-rhythm-visualizer"
version = "0.1.0"
description = "Raspberry Pi song browser and rhythm-game visualizer"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23,<3",
  "Pillow>=9,<12",
  "pygame>=2.1,<3",
  "pyserial>=3.5,<4",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
gpio = ["gpiozero>=1.6,<3"]
test = ["pytest>=7,<9"]

[project.scripts]
pi2-rhythm = "pi2rhythm.app:main"
pi2-rhythm-scan = "pi2rhythm.scanner:main"

[tool.setuptools.packages.find]
where = ["src"]
