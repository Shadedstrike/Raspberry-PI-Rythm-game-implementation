# Copy/edit this file for the cabinet. Paths may be relative to this file.
music_dir = "/media/pi/RHYTHM/music"
library_file = "library.json"
cache_dir = ".cache"

[display]
width = 1280
height = 720
fullscreen = false
fps = 60

[audio]
volume = 0.85

[serial]
# "auto" checks /dev/ttyACM* and /dev/ttyUSB*. Existing controller firmware
# lines such as "[BTN] GPIO 38 (idx 0) PRESSED" become game taps.
port = "auto"
baud = 115200

[encoder]
# BCM GPIO numbering. Set enabled=false for keyboard-only development.
enabled = true
clk = 21
dt = 20
button = 16
green_led = 19
red_led = 13
blue_led = 12
# Common-anode RGB side: connect + to 3.3V. REQUIRED: put a 220–330 ohm
# series resistor between each LED GPIO and its R/G/B cathode.
bounce_ms = 12

[start_button]
# Separate arcade start/pause button, wired between GPIO26 (physical 37) and
# GND (physical 34). The encoder shaft switch is a second start/pause control.
enabled = true
pin = 26
bounce_ms = 20
